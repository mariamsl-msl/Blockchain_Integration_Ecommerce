<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f6f8; /* gris très clair */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #344055; /* texte gris foncé */
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #dcd6f7 0%, #e7e3fc 100%);
      color: #4a4e69;
      padding: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 1000;
      transition: transform 0.3s ease-in-out;
      box-shadow: 2px 0 8px rgb(0 0 0 / 0.05);
      border-right: 1px solid #c1c1d1;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .sidebar h4 {
      font-weight: 700;
      margin-bottom: 35px;
      text-align: center;
      color: #373f51;
    }

    .nav-link {
      color: #5a5f7d;
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background-color: #a3a0f9; /* lavande doux */
      color: #fff;
      text-decoration: none;
    }

    /* Main content */
    .content {
      margin-left: 260px;
      padding: 20px;
      padding-top: 70px;
      transition: margin-left 0.3s ease-in-out;
      min-height: 100vh;
      background-color: #fff;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.05);
      border-radius: 10px;
      margin-top: 10px;
    }

    /* Quand sidebar cachée, contenu occupe tout */
    .sidebar.hidden ~ .content {
      margin-left: 0;
      border-radius: 0;
      box-shadow: none;
      margin-top: 0;
    }

    /* Navbar */
    nav.navbar-custom {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #f8f9ff; /* bleu très clair */
      box-shadow: 0 4px 12px rgba(101, 93, 182, 0.15);
      border-bottom: 2px solid #d6d6f5;
      z-index: 1050;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: #3f3d56;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #toggleSidebar {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #7267cb;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    #toggleSidebar:hover,
    #toggleSidebar:focus {
      color: #5848c2;
      outline: none;
      box-shadow: 0 0 0 3px #b2a9f6;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      color: #5848c2;
      cursor: default;
      user-select: none;
      white-space: nowrap;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-grow: 1;
      max-width: 600px;
      justify-content: flex-end;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: #e2e0f7;
      padding: 0.3rem 1.6rem;
      border-radius: 1.5rem;
      max-width: 900px;
      width: 100%;
      color: #6b6a9c;
      transition: background-color 0.3s ease;
    }

    .search-form:hover {
      background: #c8c6f9;
    }

    .search-form input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 1rem;
      padding-left: 0.25rem;
      color: #4a4a7c;
    }

    .search-form input::placeholder {
      color: #8c8bbd;
      font-style: italic;
    }

    .search-icon {
      color: #7267cb;
      font-size: 1.2rem;
    }

    .icon-btn {
      position: relative;
      font-size: 1.4rem;
      color: #7267cb;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.3s ease;
    }

    .icon-btn:hover {
      color: #5848c2;
    }

    .icon-badge {
      position: absolute;
      top: -5px;
      right: -8px;
      background: #b48aff;
      color: white;
      border-radius: 50%;
      font-size: 0.7rem;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      box-shadow: 0 0 6px rgba(180, 138, 255, 0.6);
    }

    .profile-dropdown {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: #5848c2;
      user-select: none;
      font-weight: 600;
    }

    .profile-pic {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #a399f1;
      box-shadow: 0 0 6px #b48aff;
    }

    .profile-name {
      white-space: nowrap;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        margin-left: 0 !important;
      }
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .search-form {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h4><i class="bi bi-speedometer2"></i> Admin Panel</h4>
    <a href="{% url 'admin_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
      <i class="bi bi-house-door"></i> Dashboard
    </a>
    <a href="{% url 'order_management' %}" class="nav-link {% if request.resolver_match.url_name == 'order_management' %}active{% endif %}">
      <i class="bi bi-cart-check"></i> Manage Orders
    </a>
    <a href="{% url 'product_panel' %}" class="nav-link {% if request.resolver_match.url_name == 'product_panel' %}active{% endif %}">
      <i class="bi bi-box-seam"></i> Product Control
    </a>
    <a href="{% url 'delivery_persons' %}" class="nav-link {% if request.resolver_match.url_name == 'delivery_persons' %}active{% endif %}">
      <i class="bi bi-truck"></i> Delivery Persons
    </a>
  </div>

  <!-- Navbar -->
  <nav class="navbar-custom" role="navigation" aria-label="Main navigation">
    <div class="navbar-left">
      <span class="navbar-brand">Admin</span>

      <button id="toggleSidebar" aria-label="Toggle sidebar" title="Toggle sidebar">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <div class="navbar-right">
      
      <form class="search-form" role="search" onsubmit="event.preventDefault();">
        <i class="bi bi-search search-icon"></i>
        <input type="search" placeholder="Rechercher..." aria-label="Rechercher" />
      </form>

      <div class="icon-btn" title="Panier" tabindex="0" role="button" aria-pressed="false">
        <i class="bi bi-cart"></i>
        <span class="icon-badge" aria-label="5 articles dans le panier">5</span>
      </div>

      <div class="icon-btn" title="Notifications" tabindex="0" role="button" aria-pressed="false">
        <i class="bi bi-bell"></i>
        <span class="icon-badge" aria-label="3 notifications non lues">3</span>
      </div>

      <div class="dropdown">
        <div class="profile-dropdown dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
          <img src="https://i.pravatar.cc/150?img=32" alt="Profil" class="profile-pic" />
          <span class="profile-name">{{ user.username }}</span>
        </div>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
         
          <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="content">
    {% block content %}
    <h2>Bienvenue dans le panneau d'administration</h2>
    <p>Ici vous pouvez gérer les commandes, produits, et plus encore.</p>
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const content = document.querySelector('.content');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      // Ajuster margin-left du contenu
      if (sidebar.classList.contains('hidden')) {
        content.style.marginLeft = '0';
      } else {
        content.style.marginLeft = '260px';
      }
    });
  </script>
</body>
</html>
