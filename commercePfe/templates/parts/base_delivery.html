<!-- templates/vendor/base_admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delivery Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: #343a40;
            color: white;
            padding: 20px;
        }
        .sidebar a {
            color: #ddd;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .sidebar a:hover {
            color: #fff;
        }
        .content {
            flex: 1;
            padding: 30px;
            background-color: #f8f9fa;
        }
        .header {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .logout-section {
            margin-top: auto; /* Ensures it's always at the bottom */
        }

        .logout-button {
            display: block;
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
        }

        .logout-button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4>Delivery Panel</h4>
        <a href="{% url 'livreur_dashboard' %}">Dashboard</a>

        <!-- Add more links as needed -->

        <div class="logout-section">
            <a href="{% url 'logout' %}" class="logout-button">🚪 Logout</a>
        </div>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
