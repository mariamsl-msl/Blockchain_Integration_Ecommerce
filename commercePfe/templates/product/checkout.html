{% load static %}
{% block content %}
<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      padding-top: 50px;
    }
  
    .checkout-form {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
  
    .checkout-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
  
    .form-group {
      margin-bottom: 15px;
    }
  
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
  
    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
  
    #card-element {
      background-color: #f9f9f9;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 20px;
    }
  
    #submit {
      padding: 10px;
      background-color: #6772e5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background-color 0.3s ease;
    }
  
    #submit:hover {
      background-color: #5469d4;
    }
  
    #payment-result {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: #2d9c2d; /* Green for success */
    }
  
    #payment-result.error {
      color: #e74c3c; /* Red for errors */
    }
  
    .form-group input:focus {
      border-color: #6772e5;
    }
  
    .form-group input:invalid {
      border-color: #e74c3c;
    }
  
    .form-group input:valid {
      border-color: #2d9c2d;
    }
  </style>

<div class="container">
  <div class="checkout-form">
        <h2>Checkout</h2>

        <h4>Produits sélectionnés :</h4>
        <ul>
        {% for product in products %}
            <li>{{ product.name }} - {{ product.price }} $</li>
        {% endfor %}
        </ul>
        <br/>

        <!-- 💳 Checkout Form -->

        <div id="checkoutForm" class="checkout-form">
            <h2>Enter your delivery address</h2>
            <div class="form-group"><label>Email</label><input type="email" id="customer-email" required></div>
            <div class="form-group"><label>Full name</label><input type="text" id="customer-name" required placeholder="Your full name"></div>
            <div class="form-group"><label>Phone number</label><input type="text" id="customer-phone" required placeholder="May be used to assist delivery"></div>
            <div class="form-group"><label>Address</label><input type="text" id="customer-address"></div>
            <div class="form-group"><label>City</label><input type="text" id="customer-city" required></div>
            <div class="form-group"><label>Card details</label><div id="card-element"></div></div>
            <button id="submit">Pay</button>
            <p id="payment-result"></p>
        </div>

</div>

<!-- Stripe.js -->
<!-- Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>

<script>
  const stripe = Stripe('{{ STRIPE_PUBLISHABLE_KEY }}');
  let elements, card, clientSecret;
  let selectedProductId = null;

  // 🔐 Récupère le token CSRF pour sécuriser les requêtes POST
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
  const csrftoken = getCookie('csrftoken');

  // 🛒 Lance le processus de paiement
  async function startPayment(productId) {
    selectedProductId = productId;

    try {
      const response = await fetch(`/buy/${productId}/`);
      const data = await response.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      clientSecret = data.clientSecret;
      document.getElementById('checkoutForm').style.display = 'flex';

      if (!elements) {
        elements = stripe.elements();
        card = elements.create('card');
        card.mount('#card-element');
      }

    } catch (err) {
      console.error("❌ Erreur lors de la récupération du clientSecret :", err);
      alert("Erreur lors de l'initialisation du paiement.");
    }
  }

  // 💳 Soumet le formulaire et effectue le paiement
  document.getElementById('submit').addEventListener('click', async (e) => {
    e.preventDefault();
  
    const email = document.getElementById('customer-email').value;
    const name = document.getElementById('customer-name').value;
    const phone = document.getElementById('customer-phone').value;
    const address = document.getElementById('customer-address').value;
    const city = document.getElementById('customer-city').value;
  
    if (!email || !name || !phone || !address || !city || !selectedProductId) {
      alert('Veuillez remplir tous les champs obligatoires.');
      return;
    }
  
    try {
      const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
        payment_method: {
          card: card,
          billing_details: {
            email: email,
            name: name,
            phone: phone,
            address: {
              line1: address,
              city: city
            }
          }
        }
      });
  
      if (error) {
        console.error("❌ Stripe error:", error);
        document.getElementById('payment-result').innerText = error.message;
        return;
      }
  
      if (paymentIntent && paymentIntent.status === 'succeeded') {
        document.getElementById('payment-result').innerText = "✅ Paiement réussi ! Merci pour votre commande.";
  
        // 📨 Envoi des données de la commande à Django
        try {
          const orderResponse = await fetch('/save_order/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({
              product_id: selectedProductId,
              full_name: name,
              email: email,
              phone_number: phone,
              address: address,
              city: city
            })
          });
  
          const orderData = await orderResponse.json();
  
          if (orderData.status === 'success') {
            console.log('💾 Commande enregistrée avec succès :', orderData);
            alert(`Commande validée et enregistrée ! ID commande : ${orderData.order_id}`);
          } else {
            console.warn('⚠️ Commande enregistrée partiellement :', orderData);
            alert('Le paiement a réussi, mais l\'enregistrement de la commande a échoué.');
          }
        } catch (err) {
          console.error("❌ Erreur lors de l'envoi de la commande :", err);
          alert("Le paiement a réussi, mais l'envoi des données de commande a échoué.");
        }
      }
  
    } catch (err) {
      console.error("❌ Erreur lors du traitement :", err);
      alert("Une erreur est survenue pendant le paiement ou l'enregistrement.");
    }
  });
</script>

{% endblock %}
